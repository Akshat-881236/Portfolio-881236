<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Project Gallery | Akshat Prasad</title>
<meta name="google-site-verification" content="txYZDVZk0riUwZGtitrOPot0C-AdduHrTvLbDDhOPCI" />
<meta name="google-site-verification" content="Kp1gscirNuecI5_9R4LDkE5ql4w4zt0NmneiPktuMu4" />
<meta name="description" content="An interactive gallery of web tools and learning projects by Akshat Prasad. Filter, search and open any project.">
<meta name="theme-color" content="#F5F4FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F1E" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4FB;--surface:#fff;--ink:#15152B;--mute:#5E5E7E;--line:#DEDCF0;--brand:#4338FF;--on-brand:#fff;
--pad:clamp(14px,4vw,40px);--r:20px;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"DM Sans","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F0F1E;--surface:#191931;--ink:#F1F0FF;--mute:#A3A2C4;--line:#2B2B4A;--brand:#8B84FF;--on-brand:#0F0F1E}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.55 var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,a{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}

/* Header */
.head{padding-top:clamp(22px,5vw,48px);padding-bottom:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
h1{font:800 clamp(1.9rem,6vw,3.2rem)/1 var(--display);letter-spacing:-.035em}
#count{color:var(--mute);margin-top:6px}
.tools{display:flex;gap:10px;flex:1 1 300px;justify-content:flex-end}
.search{position:relative;flex:1 1 200px;max-width:380px}
.search input{width:100%;min-height:46px;padding:0 44px 0 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);outline-offset:2px}
.search input:focus{border-color:var(--brand)}
.search kbd{position:absolute;right:14px;top:50%;translate:0 -50%;font-size:.8rem;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 7px;display:none}
.view{display:flex;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.view button{border:0;background:none;min-height:38px;padding:0 16px;border-radius:999px;font-weight:700;color:var(--mute)}
.view button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

/* Sticky filter bar */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top)}
.chips{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:10px var(--pad)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;min-height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;white-space:nowrap}
.chip small{font-weight:500;color:var(--mute);margin-left:6px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed=true] small{color:inherit;opacity:.7}

/* Gallery */
#grid{--gap:16px;display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));list-style:none;padding:12px 0 56px}
.card{--cat:var(--brand);position:relative;display:flex;flex-direction:column;gap:14px;padding:18px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .2s,border-color .2s}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--cat) 20%,transparent),transparent 70%)}
.card[data-cat=tools]{--cat:#4F46E5}.card[data-cat=education]{--cat:#D98A00}.card[data-cat=ai]{--cat:#E0457B}
.card[data-cat=seo]{--cat:#0E9F76}.card[data-cat=security]{--cat:#7A3FF2}.card[data-cat=platform]{--cat:#0B8FD6}
.hit{position:absolute;inset:0;z-index:1;border:0;background:none;border-radius:inherit}
.ico{width:56px;height:56px;border-radius:16px;background:#fff;padding:7px;object-fit:contain;border:1px solid var(--line);flex:none}
.ph{display:grid;place-items:center;font:800 1.6rem var(--display);color:var(--cat);background:color-mix(in srgb,var(--cat) 14%,var(--surface))}
.cat{display:inline-block;font-size:.82rem;font-weight:700;color:var(--cat);background:color-mix(in srgb,var(--cat) 13%,transparent);padding:1px 10px;border-radius:999px}
.card h3{font:800 1.25rem/1.15 var(--display);letter-spacing:-.02em;margin:8px 0 6px}
.card p{color:var(--mute);font-size:.96rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.go{position:relative;z-index:2;margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;min-height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;text-decoration:none}
.go:hover{background:var(--cat);border-color:var(--cat);color:#fff}
.empty{grid-column:1/-1;text-align:center;padding:56px 12px;color:var(--mute)}
.empty button{margin-top:12px;min-height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--brand);color:var(--on-brand);font-weight:700}

/* List layout (all screens) */
#grid[data-view=list]{grid-template-columns:1fr;gap:10px}
#grid[data-view=list] .card{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;padding:14px 16px}
#grid[data-view=list] .card h3{margin:4px 0 2px}
#grid[data-view=list] .card p{-webkit-line-clamp:1}
#grid[data-view=list] .go{margin:0}

/* Desktop only: mouse spotlight and lift */
@media (hover:hover) and (pointer:fine){
  .card:hover{transform:translateY(-4px);border-color:var(--cat)}
  .card:hover::before{opacity:1}
  .search kbd{display:block}
  .chip:hover:not([aria-pressed=true]){border-color:var(--ink)}
}

/* Detail dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:26px;width:min(720px,calc(100% - 32px));max-height:min(88dvh,720px);overflow:auto;overscroll-behavior:contain;box-shadow:0 30px 80px rgba(10,10,40,.35)}
dialog::backdrop{background:rgba(10,10,30,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
dialog[open]{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.m{--cat:var(--brand);display:flex;flex-direction:column;min-height:100%}
.m[data-cat=tools]{--cat:#4F46E5}.m[data-cat=education]{--cat:#D98A00}.m[data-cat=ai]{--cat:#E0457B}
.m[data-cat=seo]{--cat:#0E9F76}.m[data-cat=security]{--cat:#7A3FF2}.m[data-cat=platform]{--cat:#0B8FD6}
.m-top{display:flex;gap:20px;align-items:center;padding:clamp(20px,4vw,36px);padding-right:72px;background:color-mix(in srgb,var(--cat) 12%,var(--surface))}
.m-top .ico{width:84px;height:84px;border-radius:22px}
.m h2{font:800 clamp(1.5rem,4.5vw,2.3rem)/1.05 var(--display);letter-spacing:-.03em;margin-top:8px}
.m-body{padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;gap:18px}
.m-body p{font-size:1.1rem;max-width:56ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0}
.tags li{border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:500;font-size:.92rem}
.m-foot{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:14px clamp(20px,4vw,36px) calc(14px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);margin-top:auto}
.live{flex:1;display:inline-flex;justify-content:center;align-items:center;min-height:50px;border-radius:999px;background:var(--cat);color:#fff;font-weight:700;text-decoration:none;padding:0 22px}
.nav{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--line);background:none;font-size:1.25rem}
.pos{color:var(--mute);font-size:.9rem;min-width:52px;text-align:center}
.x{position:absolute;top:14px;right:14px;z-index:3;width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);font-size:1.3rem;box-shadow:0 2px 10px rgba(0,0,0,.15)}

/* ===== Media responsiveness ===== */
/* Tablets: bigger touch targets, roomier grid */
@media (max-width:1024px){
  #grid{--gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
}
@media (pointer:coarse){
  .chip,.go,.view button{min-height:46px}
  .nav,.x{width:52px;height:52px}
}
/* Phones: 2-up tiles in Grid, one-line rows in List, bottom-sheet dialog */
@media (max-width:640px){
  .tools{flex-basis:100%;justify-content:stretch}
  .search{max-width:none}
  #grid[data-view=grid]{grid-template-columns:repeat(2,1fr);--gap:12px}
  #grid[data-view=grid] .card{padding:14px;gap:10px;text-align:left}
  #grid[data-view=grid] .card p,#grid[data-view=grid] .go{display:none}
  #grid[data-view=grid] .card h3{font-size:1.05rem}
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:26px 26px 0 0;max-height:90dvh}
  dialog[open]{animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes sheet{from{transform:translateY(100%)}}
  .m-top{padding-bottom:22px}
  .m-top .ico{width:68px;height:68px}
  .m-foot{flex-wrap:wrap}
  .live{order:-1;flex-basis:100%}
  .nav{flex:1;border-radius:999px}
}
@media (max-width:360px){#grid[data-view=grid]{grid-template-columns:1fr}}
/* Landscape phones: keep the sheet short enough to scroll */
@media (max-height:480px) and (orientation:landscape){dialog{max-height:94dvh}.m-top .ico{width:56px;height:56px}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="wrap head">
  <div><h1>Project Gallery</h1><p id="count" aria-live="polite"></p></div>
  <div class="tools">
    <label class="search"><span class="sr">Search projects</span>
      <input id="q" type="search" placeholder="Search projects" autocomplete="off" enterkeyhint="search"><kbd>/</kbd></label>
    <div class="view" role="group" aria-label="Layout">
      <button data-v="grid" aria-pressed="true">Grid</button><button data-v="list" aria-pressed="false">List</button>
    </div>
  </div>
</header>
<div class="bar"><div class="chips wrap" id="chips" role="group" aria-label="Filter by category"></div></div>
<main class="wrap"><ul id="grid" data-view="grid"></ul><noscript>Please turn on JavaScript to browse the gallery.</noscript></main>

<dialog id="dlg" aria-label="Project details">
  <div class="m" id="m">
    <button class="x" id="x" aria-label="Close">&times;</button>
    <div class="m-top"><span id="m-ico"></span><div><span class="cat" id="m-cat"></span><h2 id="m-name"></h2></div></div>
    <div class="m-body"><p id="m-desc"></p><ul class="tags" id="m-tags"></ul></div>
    <div class="m-foot">
      <button class="nav" id="prev" aria-label="Previous project">&larr;</button>
      <span class="pos" id="pos"></span>
      <button class="nav" id="next" aria-label="Next project">&rarr;</button>
      <a class="live" id="live" target="_blank" rel="noopener">Open live project</a>
    </div>
  </div>
</dialog>

<script>
(function () {
  var A = "https://akshat-881236.github.io/", AK = A + "TrackerJS/Assets/AKNH/icon-192.png";
  var P = [
    {id:"sitemap-generator",n:"Sitemap Generator",c:"SEO",d:"Turn a list of URLs into a valid XML sitemap for Google Search Console. Works offline too.",t:["HTML","CSS","JavaScript","Offline"],u:A+"SitemapGeneratorXml/",i:A+"SitemapGeneratorXml/Assets/icon-128.png"},
    {id:"url-inspector",n:"URL Inspector",c:"SEO",d:"Preview any page, read its source and check its SEO tags. Runs fully in your browser.",t:["SEO","Privacy-first","Frontend only"],u:A+"URL-Inspector-SEO-Analyst/",i:AK},
    {id:"dpgnotes",n:"DPGNotes",c:"Education",d:"Notes, tutorials, exam papers and placement prep in a fast, mobile-first app.",t:["Firebase","SPA","Mobile-first"],u:"https://dpgnotes.web.app/",i:"https://dpgnotes.web.app/ANH.png"},
    {id:"key-of-success",n:"Key of Success",c:"Education",d:"Academic records and performance tracking for students and institutions.",t:["Dashboard","Records"],u:A+"Key-of-Success/",i:A+"TrackerJS/Assets/KOSLogo.png"},
    {id:"learning-club",n:"Learning Club",c:"Education",d:"Learning tools, PDF resources and open-web education projects in one place.",t:["PDF library","Resources"],u:A+"LearningClub-Key-of-Success-Learning-Point/",i:A+"LearningClub-Key-of-Success-Learning-Point/Assets/Icons/icon-144.png"},
    {id:"dpg-stm-blog",n:"DPG STM Blog",c:"Education",d:"An unofficial student-made page with tools and resources for DPG School of Technology & Management.",t:["College","Student tools"],u:A+"DPGStudent-881238/",i:A+"DPGStudent-881238/dpganh.png"},
    {id:"quizzone-ai",n:"Quizzone AI",c:"AI",d:"Quizzes with AI-made questions and instant feedback, built for learning that sticks.",t:["AI","Quiz","Learning"],u:A+"Quizzone/Home/QuizzoneAI.htm",i:A+"Quizzone/icons/icon-192.png"},
    {id:"anh-ai-assistant",n:"ANH AI Assistant",c:"AI",d:"A simple chat assistant written in JavaScript and connected to a backend API.",t:["JavaScript","API","Chat"],u:A+"AkshatNetworkHub/ai/index.htm",i:AK},
    {id:"validation-system",n:"ANH ValidationSystem",c:"Security",d:"Generates trusted identity metadata so static sites can verify links at runtime.",t:["Scripto","JSON","Anti-phishing"],u:"https://akshat-145609.github.io/ValidationSystem/",i:"https://akshat-145609.github.io/ValidationSystem/icon.png"},
    {id:"network-search",n:"Network Search",c:"Tools",d:"One search box across every site in the network, powered by Google Custom Search.",t:["GCSE","Search"],u:A+"SearchEngine/",i:AK},
    {id:"png-generator",n:"PNG and Base64 Icon Generator",c:"Tools",d:"Make 16 to 512 px PNG icons and Base64 strings for a PWA manifest. Nothing is uploaded.",t:["PWA","ZIP export","Base64"],u:A+"Quizzone/pngGenerator.htm"},
    {id:"profile-dashboard",n:"Profile Dashboard",c:"Platform",d:"A personal dashboard with an education timeline, skills and project list.",t:["Dashboard","Timeline"],u:A+"LocalRepo/"},
    {id:"network-hub",n:"Akshat Network Hub",c:"Platform",d:"The home base that links every project, tool and learning resource together.",t:["Hub","SEO","Responsive"],u:A+"AkshatNetworkHub/",i:AK}
  ];
  var $ = function (s) { return document.querySelector(s); };
  var grid = $("#grid"), dlg = $("#dlg"), q = $("#q"), chipBox = $("#chips");
  var cats = ["All"].concat(P.map(function (p) { return p.c; }).filter(function (c, i, a) { return a.indexOf(c) === i; }));
  var cat = "All", term = "", list = P.slice(), cur = 0;
  var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  var ico = function (p, cl) { return p.i ? '<img class="' + cl + '" src="' + p.i + '" alt="" loading="lazy" decoding="async">' : '<span class="' + cl + ' ph" aria-hidden="true">' + esc(p.n[0]) + "</span>"; };
  var slug = function (p) { return p.c.toLowerCase(); };

  /* Chips */
  chipBox.innerHTML = cats.map(function (c) {
    var n = c === "All" ? P.length : P.filter(function (p) { return p.c === c; }).length;
    return '<button class="chip" data-c="' + c + '" aria-pressed="' + (c === cat) + '">' + c + "<small>" + n + "</small></button>";
  }).join("");
  chipBox.addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    cat = b.dataset.c;
    chipBox.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
    b.scrollIntoView({ inline: "center", block: "nearest", behavior: calm ? "auto" : "smooth" });
    render();
  });

  /* Gallery */
  function render() {
    var t = term.trim().toLowerCase();
    list = P.filter(function (p) {
      return (cat === "All" || p.c === cat) && (!t || (p.n + " " + p.d + " " + p.c + " " + p.t.join(" ")).toLowerCase().indexOf(t) > -1);
    });
    $("#count").textContent = list.length === P.length ? P.length + " live projects" : "Showing " + list.length + " of " + P.length;
    grid.innerHTML = list.length ? list.map(function (p) {
      return '<li class="card" data-cat="' + slug(p) + '" data-id="' + p.id + '">' +
        '<button class="hit" aria-label="View details for ' + esc(p.n) + '"></button>' + ico(p, "ico") +
        '<div class="txt"><span class="cat">' + p.c + "</span><h3>" + esc(p.n) + "</h3><p>" + esc(p.d) + "</p></div>" +
        '<a class="go" href="' + p.u + '" target="_blank" rel="noopener" aria-label="Open ' + esc(p.n) + ' live">Open &nearr;</a></li>';
    }).join("") : '<li class="empty">Nothing matches that search.<br><button id="clear">Clear filters</button></li>';
    if (!calm && grid.animate) grid.animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: 220 });
  }
  q.addEventListener("input", function () { term = q.value; render(); });
  grid.addEventListener("click", function (e) {
    if (e.target.id === "clear") { q.value = term = ""; cat = "All"; chipBox.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", x.dataset.c === "All"); }); render(); return; }
    var c = e.target.closest(".card");
    if (c && !e.target.closest(".go")) openP(c.dataset.id);
  });
  grid.addEventListener("pointermove", function (e) {          /* desktop spotlight */
    if (e.pointerType !== "mouse") return;
    var c = e.target.closest(".card"); if (!c) return;
    var r = c.getBoundingClientRect();
    c.style.setProperty("--mx", e.clientX - r.left + "px"); c.style.setProperty("--my", e.clientY - r.top + "px");
  });
  document.addEventListener("error", function (e) {            /* icon fallback */
    var im = e.target; if (im.tagName !== "IMG" || !im.classList.contains("ico")) return;
    var s = document.createElement("span"); s.className = im.className + " ph"; s.textContent = "•"; im.replaceWith(s);
  }, true);

  /* Layout toggle: 2-up tiles on phones, one-line rows in List */
  document.querySelectorAll(".view button").forEach(function (b) {
    b.addEventListener("click", function () {
      grid.dataset.view = b.dataset.v;
      document.querySelectorAll(".view button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
    });
  });

  /* Detail dialog */
  function fill(dir) {
    var p = list[cur], m = $("#m");
    m.dataset.cat = slug(p);
    $("#m-ico").innerHTML = ico(p, "ico"); $("#m-cat").textContent = p.c; $("#m-name").textContent = p.n;
    $("#m-desc").textContent = p.d;
    $("#m-tags").innerHTML = p.t.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
    $("#live").href = p.u; $("#live").setAttribute("aria-label", "Open " + p.n + " live");
    $("#pos").textContent = cur + 1 + " / " + list.length;
    history.replaceState(null, "", "#" + p.id);
    if (dir && !calm && m.animate) m.animate([{ opacity: 0, transform: "translateX(" + dir * 28 + "px)" }, { opacity: 1, transform: "none" }], { duration: 220, easing: "ease-out" });
  }
  function openP(id) {
    var i = list.findIndex(function (p) { return p.id === id; });
    if (i < 0) { cat = "All"; term = q.value = ""; render(); i = list.findIndex(function (p) { return p.id === id; }); }
    if (i < 0) return;
    cur = i; fill(0); if (!dlg.open) dlg.showModal();
  }
  function step(d) { if (list.length < 2) return; cur = (cur + d + list.length) % list.length; fill(d); }
  $("#next").onclick = function () { step(1); };
  $("#prev").onclick = function () { step(-1); };
  $("#x").onclick = function () { dlg.close(); };
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("close", function () { history.replaceState(null, "", location.pathname + location.search); });

  /* Swipe between projects (phones and tablets) */
  var sx = 0, sy = 0;
  dlg.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  dlg.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 40) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* Keyboard (desktop) */
  document.addEventListener("keydown", function (e) {
    if (dlg.open) { if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); return; }
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
  window.addEventListener("hashchange", function () { var id = location.hash.slice(1); if (id && P.some(function (p) { return p.id === id; })) openP(id); });

  /* Start: phones default to the compact list */
  if (innerWidth <= 640) document.querySelector('.view button[data-v="list"]').click();
  render();
  if (location.hash) openP(location.hash.slice(1));
